{% extends "base.html" %}
{% block title %}Counter-roll | Edit profile{% endblock %}
{% block content %}
<div class="edit_profile">
    <h1>Edit profile</h1>
    <h2>Email: {{user["email"]}}</h2>
    {%if mistake%}
    <h2>{{mistake}}</h2>
    {%endif%}
    <form action="/profile" method="POST">
        <div class="name-field"><label for="username">Username:</label> 

        <input type="username" name="username" placeholder="{{user["username"]}}"></div>

        <div class="name-field"><label for="new_password"> New Password:</label> 

        <input type="password" name="new_password"></div>

        <div class="name-field"><label for="new_password_2"> New Password (again):</label> 

        <input type="password" name="new_password_2"></div>

        <div class="name-field"><label for="password"> Password to confirm:</label> 

        <input type="password" name="password" required></div>

        <button type="submit">Save</button>

    </form>
</div>
    
<div class="delete-section">
    <h1>Delete Profile</h1>
        <h2>Email: {{user["email"]}}</h2>
        {%if deleted == False%}
        <h2>Wrong password!</h2>
        {%endif%}
        <form action="{{ url_for('delete_profile') }}" method="POST">
        <input type="password" name="password" placeholder="Confirm password" required>
        <button type="submit">Delete Profile</button>
    </form>
</div>
{% endblock %}

{%extends "base.html"%}
{%block title%}{{case['name']}}{%endblock%}
{%block content%}
<div class="show">
{%for item in items%}

    <div class="item {{item['rarity']}}">   
    <p>{{item['weapon_name']}} | {{item['name']}}</p>
    <img src="{{ url_for('static', filename='images/skins/' + item['image']) }}" alt="{{item['name']}}">
    </div>


{% endfor %}
</div>
{%endblock%}
